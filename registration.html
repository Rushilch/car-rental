<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Car Rental Program</title>
	<style>
		body {
			background-image: url("newback.jpg");
			background-repeat: no-repeat;
			background-size: cover;
			font-family: Arial, sans-serif;
			margin: 0;
			min-height: 100vh;
			position: relative;
			padding-bottom: 60px; /* Adjust this value based on the footer's height */
			box-sizing: border-box;
		}
		#header {
			width: 100%;
			height: 150px;
			background: transparent;
			font-size: 1.7em;
			text-align: center;
			padding-top: 20px;
		}
		#links {
			width: 100%;
			height: 100px;
			background-color: transparent;
			font-size: 1.2em;
			text-align: center;
		}
		#links ul {
			padding: 0;
			margin: 0;
			list-style: none;
		}
		#links ul li {
			display: inline;
			margin: 0 20px;
			font-weight: bolder;
		}
		#links ul li a {
			text-decoration: none;
			color: wheat;
		}
		.container {
			text-align: center;
			margin: 50px auto;
			background: rgba(0, 0, 0, 0.7);
			padding: 10px;
			border-radius: 10px;
			width: 50%;
			text-align: center;
		}
		table {
			margin: 0 auto;
			text-align: left;
			color: white;
		
		}
		th , td {
			padding: 15px;
		}
		input[type="text"], input[type="date"], input[type="password"], input[type="email"], input[type="tel"], input[type="radio"] {
			width: 100%;
			padding: 8px;
			margin: 5px 0;
			box-sizing: border-box;
			border: none;
			border-radius: 4px;
		}
		.button-container {
			text-align: center;
			margin-top: 20px;
		}
		button {
			background-color: #4CAF50;
			color: white;
			padding: 10px 20px;
			margin: 10px;
			border: none;
			border-radius: 4px;
			cursor: pointer;
		}
		button:hover {
			background-color: #45a049;
		}
		a {
			color: wheat;
		}
		#footer {
			width: 100%;
			background-color: rgba(245, 222, 179, 0.197);
			padding: 5px;
			position:static;
			bottom:0;
			text-align:center;
			
		}
	</style>
</head>
<body>
	<div id="header">
		<h1 style="color: azure;">Online Car Rental</h1>
	</div>
	<div id="links">
		<ul>
			<li><a href="index.html">Home</a></li>
			<li><a href="login.html">Login</a></li>
			<li><a href="services.html">Services</a></li>
			<li><a href="aboutus.html">About Us</a></li>
		</ul>
	</div>
	<div class="container">
		<h2 style="color:azure;">Registration</h2>
                <form action="registeraction.jsp" method="post">
			<table>
                            <tr>
                            <th>First Name</th>
                            <td><input type="text" name="firstname" required></td>
                            <tr>
                            <th>Last Name</th>
                            <td><input type="text" name="lastname" required></td>	
                            <tr>
                            <th>Gender</th>
                            <td><input type="radio" name="gender" value="Male">Male
                                <input type="radio" name="gender" value="Female">Female</td>
                            <tr>    
                                <th>Date of Birth</th>
                                <td><input type="date" id="birthday" name="birthday" required></td>
                            <tr>
				<th>Email</th>
				<td><input type="email" name="email" required></td>
                            </tr>
                            <tr>
				<th>Contact Number</th>
				<td><input type="tel" name="contactnumber" required></td>
                            </tr>
                            <tr>
				<th>City</th>
				<td><input type="text" name="city" required></td>
                            </tr>
                            <tr>
				<th>State</th>
				<td><input type="text" name="state" required></td>
			    </tr>
                            <tr>
				<th>Pin-code</th>
				<td><input type="text" name="pincode" required></td>
                            </tr>
                            <tr>
                            <th>Username</th>
                            <td><input type="text" name="username" placeholder="Username" required></td>
                            </tr>
                            <tr>
				<th>Password</th>
				<td><input type="password" name="password" placeholder="Password" required></td>
                            </tr>
			</table>
			<div class="button-container">
				<button type="submit">Submit</button>
			</div>
		</form>
		<br>
		<a href="login.html">Already have an account?</a>
	</div>
	<div id="footer">
            <p>&copy; 2024 Car Rental Program. All rights reserved.</p>
	</div>
</body>
</html>
